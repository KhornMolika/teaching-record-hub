<!-- Stats Cards -->
<div class="grid grid-cols-4 gap-6 mb-8">
  <!-- Total Hours -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
    <div class="flex justify-between items-start mb-4">
      <div>
        <div class="text-sm text-gray-500 mb-1">Total Hours</div>
        <div class="text-3xl font-bold text-indigo-600">{{ total_hours_completed|default:"0" }}h</div>
        <div class="text-xs text-gray-400 mt-1">of {{ target_hours }}h target</div>
      </div>
      <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center">
        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Sessions -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
    <div class="flex justify-between items-start mb-4">
      <div>
        <div class="text-sm text-gray-500 mb-1">Sessions</div>
        <div class="text-3xl font-bold text-teal-600">{{ total_sessions_completed|default:"0" }}</div>
        <div class="text-xs text-gray-400 mt-1">This semester</div>
      </div>
      <div class="w-12 h-12 bg-teal-100 rounded-full flex items-center justify-center">
        <svg class="w-6 h-6 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Predicted Total -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
    <div class="flex justify-between items-start mb-4">
      <div>
        <div class="text-sm text-gray-500 mb-1">Predicted Total</div>
        <div class="text-3xl font-bold text-green-600">{{ predicted_total_hours|default:"0" }}h</div>
        <div class="text-xs text-gray-400 mt-1">Based on weekly avg</div>
      </div>
      <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Avg Weekly -->
  <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
    <div class="flex justify-between items-start mb-4">
      <div>
        <div class="text-sm text-gray-500 mb-1">Avg Weekly</div>
        <div class="text-3xl font-bold text-amber-600">{{ average_weekly_hours|default:"0" }}h</div>
        <div class="text-xs text-gray-400 mt-1">Per week</div>
      </div>
      <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center">
        <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>
  </div>
</div>
