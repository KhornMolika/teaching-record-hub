<!-- Weekly Hours Chart -->
<div class="col-span-2 bg-white rounded-xl p-6 shadow-sm border border-gray-100">
  <h2 class="text-xl font-bold text-gray-900 mb-6">My Weekly Hours</h2>
  {% if weekly_hours_chart_data %}

      <canvas id="weeklyHoursChart"></canvas>

  {% endif %}
</div>
