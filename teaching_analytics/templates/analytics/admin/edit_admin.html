{% extends "../base.html" %} {% block title %}Edit Administrator{% endblock %}
{% block content %}
<div class="flex min-h-screen bg-gray-50">
  <!-- Include Admin Sidebar -->
  {% include "./sidebarAdmin.html" %}

  <!-- Main Content -->
  <div class="flex-1 ml-64 py-8 px-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Edit Administrator</h1>
        <p class="text-gray-500 mt-1">Update details for {{ admin.get_full_name }}.</p>
      </div>
    </div>

    <!-- Edit Form -->
    <div class="bg-white rounded-xl p-8 shadow-sm border border-gray-100">
      <form method="post">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- First Name -->
          <div>
            <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
            <input type="text" name="first_name" id="first_name" value="{{ admin.first_name }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <!-- Last Name -->
          <div>
            <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
            <input type="text" name="last_name" id="last_name" value="{{ admin.last_name }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <!-- Email -->
          <div class="md:col-span-2">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" id="email" value="{{ admin.email }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>
          <!-- Superuser status -->
          <div class="md:col-span-2">
            <label for="is_superuser" class="flex items-center">
              <input type="checkbox" name="is_superuser" id="is_superuser" {% if admin.is_superuser %}checked{% endif %} class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
              <span class="ml-2 text-sm text-gray-700">Is Superuser</span>
            </label>
          </div>
        </div>

        <!-- Buttons -->
        <div class="mt-8 flex justify-end gap-4">
          <a href="{% url 'manage_admins' %}" class="px-6 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">
            Cancel
          </a>
          <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
